<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ログイン | B! ID</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17212b;font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;line-height:1.7}.top{height:62px;background:white;border-bottom:1px solid #e4e9ef;padding:0 max(20px,calc((100% - 920px)/2));display:flex;align-items:center}.logo{font-weight:800;font-size:21px;color:#17212b;text-decoration:none}main{max-width:440px;margin:56px auto;padding:0 20px}.panel{background:white;border:1px solid #e2e8ef;border-radius:16px;padding:30px;box-shadow:0 8px 24px #17212b0a}h1{margin:0 0 8px;font-size:25px}.sub{color:#687583;font-size:14px;margin:0 0 24px}.field{margin:0 0 18px}label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}input{width:100%;padding:13px;border:1px solid #cbd4de;border-radius:8px;font:inherit;font-size:16px}input:focus{outline:3px solid #d5e7ff;border-color:#2873c8}button{width:100%;padding:13px;border:0;border-radius:8px;background:#246dc1;color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:default}.msg{min-height:24px;font-size:13px;color:#596777}.error{color:#bd2929}.links{text-align:center;font-size:13px;margin-top:20px}.links a{color:#246dc1}.home{color:#687583;font-size:13px;text-align:center;margin-top:22px}footer{text-align:center;color:#84909c;font-size:12px;margin:35px}
</style></head><body><header class="top"><a class="logo" href="../">B! ID</a></header><main><div class="panel">
<h1>ログイン</h1><p class="sub">登録済みのメールアドレスでログインします。</p>
<p id="target" class="sub">ログイン先を確認しています…</p>
<form id="form"><div class="field"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" required></div>
<div class="field" id="codeBox" hidden><label for="code">認証コード（6桁）</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div>
<p id="msg" class="msg" role="status" aria-live="polite"></p><button id="submit">認証コードを送る</button></form>
<div class="links">アカウントをお持ちでない方は <a href="../register/">新規登録</a></div></div><p class="home"><a href="../">ホームに戻る</a></p></main><footer>© B! ID</footer>
<script>
var API_URL='https://script.google.com/macros/s/ここにデプロイID/exec';
var redirect=new URLSearchParams(location.search).get('redirect');var step=0;
var form=document.getElementById('form'),email=document.getElementById('email'),code=document.getElementById('code'),box=document.getElementById('codeBox'),btn=document.getElementById('submit'),msg=document.getElementById('msg');
document.getElementById('target').textContent=redirect?'ログイン先: '+new URL(redirect).host:'サービスから開いてください。';
function say(s,e){msg.textContent=s;msg.className='msg'+(e?' error':'')}
function api(v){return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(v)}).then(r=>r.json())}
form.addEventListener('submit',function(e){e.preventDefault();if(!redirect){say('ログイン元のサービスが指定されていません。',true);return}btn.disabled=true;
if(step===0){say('認証コードを確認しています…');api({action:'request_login_code',email:email.value.trim(),redirect:redirect}).then(function(r){if(r.ok){step=1;email.readOnly=true;box.hidden=false;btn.textContent='ログイン';say('認証コードをメールで送信しました。');code.focus()}else say(r.error==='not_registered'?'アカウントが見つかりません。先に新規登録してください。':'送信できませんでした。時間をおいてお試しください。',true)}).catch(()=>say('通信に失敗しました。',true)).finally(()=>btn.disabled=false)}
else{say('ログインしています…');api({action:'verify_login_code',email:email.value.trim(),code:code.value.trim(),redirect:redirect}).then(function(r){if(r.ok){say('ログインしました。移動します。');location.replace(r.redirect+'#bid_token='+r.token)}else say(r.error==='not_registered'?'アカウントが見つかりません。新規登録してください。':'認証コードが違うか、有効期限が切れています。',true)}).catch(()=>say('通信に失敗しました。',true)).finally(()=>btn.disabled=false)}
});
</script></body></html>
